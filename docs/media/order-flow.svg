<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Two ways to buy: a B2B quote round trip and a B2C card checkout">
  <defs>
    <style>
      text { font-family: Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .lane { font-size: 15px; font-weight: 700; letter-spacing: .12em; }
      .step { font-size: 15px; font-weight: 600; fill: #1d1f20; }
      .sub  { font-size: 12px; fill: #5d5d60; }
      .track { stroke-dasharray: 4 6; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1b222b } .card { fill: #26303b } .step { fill: #eef2f6 } .sub { fill: #a9b4c0 }
      }
    </style>
  </defs>
  <rect class="bg" width="1200" height="340" rx="18" fill="#f5f5f8"/>

  <!-- B2B lane -->
  <text class="lane" x="40" y="44" fill="#5980a6">B2B · REQUEST FOR QUOTE</text>
  <path id="b2b" class="track" d="M110 100 H1090" stroke="#5980a6" stroke-width="2" fill="none"/>
  <g>
    <g transform="translate(110 100)"><circle class="card" r="30" fill="#fff" stroke="#5980a6" stroke-width="2"/><text x="0" y="7" text-anchor="middle" font-size="22">🧺</text></g>
    <g transform="translate(355 100)"><circle class="card" r="30" fill="#fff" stroke="#5980a6" stroke-width="2"/><text x="0" y="7" text-anchor="middle" font-size="22">📝</text></g>
    <g transform="translate(600 100)"><circle class="card" r="30" fill="#fff" stroke="#5980a6" stroke-width="2"/><text x="0" y="7" text-anchor="middle" font-size="22">💶</text></g>
    <g transform="translate(845 100)"><circle class="card" r="30" fill="#fff" stroke="#5980a6" stroke-width="2"/><text x="0" y="7" text-anchor="middle" font-size="22">🤝</text></g>
    <g transform="translate(1090 100)"><circle class="card" r="30" fill="#fff" stroke="#5980a6" stroke-width="2"/><text x="0" y="7" text-anchor="middle" font-size="22">📦</text></g>
  </g>
  <g text-anchor="middle">
    <text class="step" x="110" y="152">Basket</text><text class="sub" x="110" y="170">signed-in buyer</text>
    <text class="step" x="355" y="152">Quote request</text><text class="sub" x="355" y="170">QT-0041</text>
    <text class="step" x="600" y="152">Priced by staff</text><text class="sub" x="600" y="170">admin portal</text>
    <text class="step" x="845" y="152">Accepted</text><text class="sub" x="845" y="170">credit + terms checked</text>
    <text class="step" x="1090" y="152">Order</text><text class="sub" x="1090" y="170">SO-0012</text>
  </g>
  <circle r="8" fill="#f2a93b">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;.25;.25;.5;.5;.75;.75;1;1" keyTimes="0;.08;.2;.28;.4;.48;.6;.68;.8;1" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"><mpath href="#b2b"/></animateMotion>
  </circle>

  <!-- B2C lane -->
  <text class="lane" x="40" y="208" fill="#2e8b6e">B2C · DIRECT CHECKOUT</text>
  <path id="b2c" class="track" d="M110 250 H1090" stroke="#2e8b6e" stroke-width="2" fill="none"/>
  <g>
    <g transform="translate(110 250)"><circle class="card" r="24" fill="#fff" stroke="#2e8b6e" stroke-width="2"/><text x="0" y="6" text-anchor="middle" font-size="18">🛒</text></g>
    <g transform="translate(355 250)"><circle class="card" r="24" fill="#fff" stroke="#2e8b6e" stroke-width="2"/><text x="0" y="6" text-anchor="middle" font-size="18">🧾</text></g>
    <g transform="translate(600 250)"><circle class="card" r="24" fill="#fff" stroke="#2e8b6e" stroke-width="2"/><text x="0" y="6" text-anchor="middle" font-size="18">💳</text></g>
    <g transform="translate(845 250)"><circle class="card" r="24" fill="#fff" stroke="#2e8b6e" stroke-width="2"/><text x="0" y="6" text-anchor="middle" font-size="18">✅</text></g>
    <g transform="translate(1090 250)"><circle class="card" r="24" fill="#fff" stroke="#2e8b6e" stroke-width="2"/><text x="0" y="6" text-anchor="middle" font-size="18">🚚</text></g>
  </g>
  <g text-anchor="middle">
    <text class="step" x="110" y="298">Cart</text><text class="sub" x="110" y="316">guests welcome</text>
    <text class="step" x="355" y="298">Checkout</text><text class="sub" x="355" y="316">stock reserved</text>
    <text class="step" x="600" y="298">Stripe</text><text class="sub" x="600" y="316">hosted payment page</text>
    <text class="step" x="845" y="298">Paid</text><text class="sub" x="845" y="316">signed webhook</text>
    <text class="step" x="1090" y="298">Shipped</text><text class="sub" x="1090" y="316">tracking number mailed</text>
  </g>
  <circle r="7" fill="#f2a93b">
    <animateMotion dur="5s" begin="1s" repeatCount="indefinite" keyPoints="0;0;.25;.25;.5;.5;.75;.75;1;1" keyTimes="0;.08;.2;.28;.4;.48;.6;.68;.8;1" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"><mpath href="#b2c"/></animateMotion>
  </circle>
</svg>
